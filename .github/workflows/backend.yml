name: backend

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  checks:
    runs-on: ubuntu-24.04
    # Тесты репозиториев идут на настоящем PostgreSQL той же версии, что в docker-compose.yml.
    services:
      postgres:
        image: postgres:16.15-alpine3.24
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: credit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d credit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Интеграционные тесты адаптеров aio-pika идут на настоящем брокере.
      rabbitmq:
        image: rabbitmq:4.3.7-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: app
          RABBITMQ_DEFAULT_PASS: app
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/credit_test
      # Бакеты *-test тесты создают сами.
      TEST_S3_ENDPOINT: http://localhost:9000
      TEST_S3_ACCESS_KEY: minioadmin
      TEST_S3_SECRET_KEY: minioadmin
      TEST_RABBITMQ_URL: amqp://app:app@localhost:5672/
    steps:
      - uses: actions/checkout@v7.0.1
      # services не умеют передавать команду контейнеру, а MinIO нужен `server /data`.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$TEST_S3_ACCESS_KEY" -e MINIO_ROOT_PASSWORD="$TEST_S3_SECRET_KEY" \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          docker logs minio
          exit 1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.15.1"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -q

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -t credit-conveyor-backend:ci .
