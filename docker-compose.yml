include:
  - backend/docker-compose.yml

services:
  seed:
    build: ./backend
    command: ["python", "-m", "app.infra.mocks.seed"]
    env_file:
      - path: backend/.env.example
      - path: backend/.env
        required: false
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
